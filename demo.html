<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帧境 · GPU 测试播放器</title></head><body><div class="demo-shell"><header><h1>帧境测试播放器</h1><a href="./options.html">查看控制面板</a></header><p>本地生成的 SDR 测试画面，不读取外部视频。</p><div id="player"><video id="video" muted playsinline></video></div><div class="demo-actions"><button id="sync">生成带声音的同步测试片</button><button id="play">播放测试画面</button><button id="live-pipeline">运行完整真人预设</button><button id="anime-pipeline">运行完整动画预设</button><button id="cas">运行 AMD CAS</button><button id="filters">运行去块与去色带</button><button id="fsrcnnx">运行 FSRCNNX 2× 与 CAS</button><button id="anime">运行 Anime4K 修复与 2×放大</button><button id="compare">左右对比</button><button id="stop">恢复原画</button><button id="fullscreen">容器全屏</button></div><div id="result" role="status">等待播放</div><pre id="log"></pre><p class="note">扩展测试前先恢复原画，再从 Edge 面板应用。不要同时运行页面测试与扩展增强。默认动态画面没有音轨；声画测试按钮会本地生成带闪白和短音的片段。先听原画确认基线，再比较增强；浏览器录制和显示会有误差，不能据此宣称毫秒级同步。</p></div><script type="module" src="/src/demo.ts"></script></body></html>
