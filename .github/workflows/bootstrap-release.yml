name: Bootstrap 1.0.0 release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack reviewed source
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('framehaven-source-1.0.0.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '14ca33350a167e0d76f3b4c87e668b5a37428dcd5f76a1dab27198ad6ab6aff6'
          with zipfile.ZipFile(archive) as bundle:
            for name in bundle.namelist():
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
            bundle.extractall('.')
          archive.unlink()
      - name: Commit public source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git commit -m 'Release Framehaven 1.0.0 source'
          git push origin HEAD:main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - run: pnpm release:verify
