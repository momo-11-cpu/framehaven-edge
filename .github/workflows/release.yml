name: Publish release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - run: pnpm release:verify
      - name: Publish versioned ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version=$(node -p "require('./package.json').version")
          gh release create "v${release_version}" "artifacts/framehaven-edge-${release_version}.zip" "artifacts/framehaven-edge-${release_version}.zip.sha256" --target "$GITHUB_SHA" --title "帧境 Framehaven ${release_version}" --notes-file RELEASE_NOTES.md
